# Mosquitto 2.x — захищений брокер для проєкту «Розумна квартира»
# Порт 1883 НЕ відкривається взагалі — лише TLS на 8883.

# Обмеження розміру повідомлення (наші JSON < 200 байт)
message_size_limit 4096

persistence true
persistence_location /mosquitto/data/

# Логи: достатньо детальні, щоб у відео показати відмови автентифікації та ACL
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
log_type debug
connection_messages true

listener 8883 0.0.0.0
protocol mqtt
# Обмеження проти зловживань (STRIDE: Denial of Service)
max_connections 30

# Автентифікація: анонімний доступ вимкнено
allow_anonymous false
password_file /mosquitto/data/passwd

# Авторизація: ACL за принципом найменших привілеїв
acl_file /mosquitto/data/acl

# TLS з власним CA (файли копіює entrypoint.sh з правильними правами)
cafile   /mosquitto/tls/ca.crt
certfile /mosquitto/tls/server.crt
keyfile  /mosquitto/tls/server.key
require_certificate false
